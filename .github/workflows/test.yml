name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        swift-version: ['6.0', '6.2', '6.4']
    container: swift:${{ matrix.swift-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      # Tests use swift-testing, which every supported toolchain bundles, so the
      # suite runs on all of them. The script runs it with coverage enabled and
      # exports coverage.lcov.
      - name: Run tests
        run: scripts/export-coverage.sh

  # The regular jobs build and test against the swift-syntax version resolution
  # picks, which is the newest in the accepted range. This job proves the rest of
  # the range stays buildable: the latest patch of every other swift-syntax
  # major, plus the floor of the range on the oldest supported toolchain.
  # Tests need the resolved swift-syntax (the pinned expansions assume its
  # formatting), so this job is build-only.
  swift-syntax-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift-version: ['6.4']
        swift-syntax-version: ['600.0.1', '601.0.1', '602.0.0', '603.0.2']
        include:
          - swift-version: '6.0'
            swift-syntax-version: '600.0.1'
    container: swift:${{ matrix.swift-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      # Rewrite the manifest to an exact pin rather than using
      # `swift package resolve swift-syntax --version ...`, which needs the
      # dependency to already be resolved.
      - name: Pin swift-syntax ${{ matrix.swift-syntax-version }}
        run: |
          sed -i 's|"600.0.0"..<"605.0.0"|exact: "${{ matrix.swift-syntax-version }}"|' Package.swift
          swift package resolve

      - name: Build
        run: swift build

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: scripts/export-coverage.sh

      # Both test jobs export a report, but the two platforms exercise nearly
      # the same lines, so one upload is enough to describe the package.
      #
      # Pull requests from forks cannot read CODECOV_TOKEN, so they skip the
      # upload instead of failing over a secret they were never given. Pushes
      # to main still upload, which is what later pull requests compare against.
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          disable_search: true
          fail_ci_if_error: true

  test:
    runs-on: ubuntu-latest
    needs: [build, swift-syntax-compat, macos]
    if: always()
    steps:
      - name: Check build results
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs['swift-syntax-compat'].result }}" != "success" ] || [ "${{ needs.macos.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi
          echo "All builds passed"
